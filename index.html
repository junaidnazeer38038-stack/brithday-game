<!DOCTYPE html>
<html>
<head>
  <title>Happy Birthday 🎂</title>

  <style>
    body{
      text-align:center;
      font-family:Arial;
      background:linear-gradient(45deg, #ff9a9e, #fad0c4);
      height:100vh;
      overflow:hidden;
    }

    h1{
      margin-top:40px;
      font-size:38px;
      color:white;
      display:none;
    }

    button{
      padding:15px 30px;
      font-size:20px;
      border:none;
      border-radius:10px;
      background:#ff4b5c;
      color:white;
      cursor:pointer;
      margin-top:120px;
    }

    .cake{
      width:150px;
      height:100px;
      background:#8b4513;
      margin:20px auto;
      position:relative;
      border-radius:10px;
      display:none;
    }

    .candle{
      width:10px;
      height:30px;
      background:white;
      position:absolute;
      top:-30px;
      left:70px;
    }

    .flame{
      width:10px;
      height:10px;
      background:yellow;
      border-radius:50%;
      position:absolute;
      top:-40px;
      left:70px;
      animation: flicker 0.5s infinite alternate;
    }

    @keyframes flicker {
      from{opacity:1;}
      to{opacity:0.3;}
    }

    .balloon{
      width:50px;
      height:70px;
      border-radius:50%;
      position:absolute;
      bottom:-100px;
      animation: float 6s linear infinite;
    }

    @keyframes float {
      0%{transform:translateY(0);}
      100%{transform:translateY(-100vh);}
    }

    #info{
      color:white;
      font-size:18px;
      display:none;
    }
  </style>
</head>

<body>

<button onclick="startParty()">Start Birthday 🎁</button>

<h1 id="msg">🎉 Happy Birthday Junaid 🎂🎈</h1>
<p id="info">🎤 Mic allow karo aur candle par phook maro 💨</p>

<div class="cake" id="cake">
  <div class="candle"></div>
  <div class="flame" id="flame"></div>
</div>

<audio id="music" src="https://www.myinstants.com/media/sounds/happy-birthday-to-you.mp3"></audio>

<script>
let audioContext, mic, analyser, dataArray;

function startParty(){
  document.getElementById("msg").style.display="block";
  document.getElementById("cake").style.display="block";
  document.getElementById("info").style.display="block";

  document.getElementById("music").play();

  // Balloons
  for(let i=0; i<15; i++){
    let b = document.createElement("div");
    b.className = "balloon";
    b.style.left = Math.random()*100 + "vw";
    b.style.background = randomColor();
    document.body.appendChild(b);
  }

  startMic();
}

function randomColor(){
  let colors = ["red","blue","green","yellow","purple","orange","pink"];
  return colors[Math.floor(Math.random()*colors.length)];
}

// 🎤 Mic detect (blow)
function startMic(){
  navigator.mediaDevices.getUserMedia({ audio: true })
  .then(stream => {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    mic = audioContext.createMediaStreamSource(stream);
    analyser = audioContext.createAnalyser();
    mic.connect(analyser);

    dataArray = new Uint8Array(analyser.frequencyBinCount);

    detectBlow();
  })
  .catch(err => {
    alert("Mic allow karo warna candle nahi bujhegi 😅");
  });
}

function detectBlow(){
  analyser.getByteFrequencyData(dataArray);

  let volume = dataArray.reduce((a,b)=>a+b)/dataArray.length;

  // 🔥 Agar awaz zyada ho (phook)
  if(volume > 60){
    document.getElementById("flame").style.display="none";
    document.getElementById("info").innerText = "🎉 Candle Bujh Gayi! 🎂";
  }

  requestAnimationFrame(detectBlow);
}
</script>

</body>
</html>
